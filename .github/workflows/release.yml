name: release

# Builds installers for macOS, Linux and Windows. Triggered by a version tag or manually; it only
# uploads workflow artifacts and (for tags) attaches them to a draft GitHub release. Nothing here
# signs or notarizes unless the optional secrets below are set.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macos-arm64
            formats: app,dmg
          - os: macos-13
            name: macos-x64
            formats: app,dmg
          - os: ubuntu-22.04
            name: linux-x64
            formats: appimage,deb
          - os: windows-2022
            name: windows-x64
            formats: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgtk-3-dev libfuse2

      - name: Build rteams-gui and rteams
        run: cargo build --release --locked -p rteams-gui -p rteams-cli

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      # Optional macOS signing + notarization: set these repository secrets to enable it.
      # APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
      # APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID.
      - name: Package
        shell: bash
        env:
          CARGO_PACKAGER_SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: cargo packager --release --formats "${{ matrix.formats }}"

      - uses: actions/upload-artifact@v4
        with:
          name: rteams-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*-setup.exe
            dist/*.msi
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS

      - name: Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/* \
            --repo "${{ github.repository }}" --draft --generate-notes
