[package]
name = "rteams-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rteams-gui"
path = "src/main.rs"

[dependencies]
rteams-core.workspace = true
rteams-store.workspace = true
rteams-server.workspace = true
serde.workspace = true
serde_json.workspace = true
rteams-services.workspace = true
egui_extras = { version = "0.37", default-features = false, features = ["syntect", "image"] }
rfd = "0.15"
open = "5"
ctrlc = { version = "3", features = ["termination"] }
# `clipboard`: Cmd/Ctrl+C, X and V (paste into the chat composer, copy a message).
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "clipboard"] }
# Icon glyphs (people, chat, folder, play/stop...) live in egui's emoji fonts.
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
regex = "1"
# PNG-encode a pasted clipboard image (egui reports it as Event::PasteImage).
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile.workspace = true
# Offscreen rendering of real screens to PNG (UI review against the original's screenshots).
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot", "eframe"] }
