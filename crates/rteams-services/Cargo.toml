[package]
name = "rteams-services"
version.workspace = true
edition.workspace = true
license.workspace = true

# Headless logic for the desktop app (no egui): persistence, usage, terminal sessions, editor
# services, projects, templates, import. Every module is unit-testable without a window.
[dependencies]
rteams-core.workspace = true
rteams-store.workspace = true
rteams-server.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
portable-pty = "0.9"
vt100 = "0.16"
similar = "2"
regex = "1"
notify = "8"
ignore = "0.4"
fuzzy-matcher = "0.3"
trash = "5"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
calamine = "0.26"
intl_pluralrules = "7"
unic-langid = "0.9"
sys-locale = "0.3"
toml_edit = "0.25"
croner = "2"
chrono-tz = "0.10"
tiny_http = "0.12"
semver = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
tempfile.workspace = true
